[project]
name = "kharchalens"
version = "0.1.0"
description = "Privacy-first expense intelligence for Indian bank statements."
readme = "README.md"
requires-python = ">=3.14,<3.15"

authors = [
    { name = "Aakash Raj" }
]

dependencies = [
    "streamlit>=1.47.0",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.14.0",
    "pdfplumber>=0.11.10",
    "cryptography==42.0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kharchalens"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
